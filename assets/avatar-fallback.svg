<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cyberRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)"/>

  <!-- Subtle Tech Grid Lines -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#cyberRing)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Glowing Accent Arc -->
  <path d="M 120 70 A 210 210 0 0 1 430 320" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Developer Silhouette / Modern Avatar Construct -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Torso -->
    <path d="M 140 430 C 140 340, 200 320, 250 320 C 300 320, 360 340, 360 430 C 360 460, 140 460, 140 430 Z" 
          fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <!-- Collar / Hoodie V-neck accent -->
    <path d="M 225 325 L 250 365 L 275 325" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neck -->
    <rect x="232" y="270" width="36" height="55" rx="10" fill="#334155"/>
    
    <!-- Head / Face -->
    <ellipse cx="250" cy="225" rx="55" ry="65" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    
    <!-- Modern Hair & Tech Headset / Frame -->
    <path d="M 195 210 C 190 150, 240 140, 275 145 C 310 150, 310 190, 305 210 C 295 180, 280 170, 250 170 C 215 170, 205 190, 195 210 Z" 
          fill="url(#accentGrad)"/>
    
    <!-- Glasses / AR Smart Specs -->
    <rect x="210" y="210" width="35" height="22" rx="6" fill="#0B0F19" stroke="#38BDF8" stroke-width="2.5" filter="url(#slightGlow)"/>
    <rect x="255" y="210" width="35" height="22" rx="6" fill="#0B0F19" stroke="#38BDF8" stroke-width="2.5" filter="url(#slightGlow)"/>
    <line x1="245" y1="221" x2="255" y2="221" stroke="#38BDF8" stroke-width="2"/>
    <line x1="198" y1="218" x2="210" y2="221" stroke="#38BDF8" stroke-width="2"/>
    <line x1="290" y1="221" x2="302" y2="218" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <!-- Glowing Tech Badges / Floating Elements -->
  <!-- AI / ML Node left -->
  <g transform="translate(70, 190)">
    <circle cx="20" cy="20" r="22" fill="#111827" stroke="#38BDF8" stroke-width="1.5" filter="url(#slightGlow)"/>
    <text x="20" y="25" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;AI&gt;</text>
  </g>

  <!-- Python / Code Node right -->
  <g transform="translate(390, 220)">
    <circle cx="20" cy="20" r="22" fill="#111827" stroke="#818CF8" stroke-width="1.5" filter="url(#slightGlow)"/>
    <text x="20" y="25" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">.py</text>
  </g>

  <!-- Floating Initials Pill at bottom center -->
  <g transform="translate(170, 415)">
    <rect width="160" height="38" rx="19" fill="#0B0F19" stroke="url(#accentGrad)" stroke-width="2" filter="url(#slightGlow)"/>
    <circle cx="24" cy="19" r="6" fill="#10B981"/>
    <text x="95" y="24" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">KALPATARU SAHA</text>
  </g>
</svg>
